name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Repository hygiene
        run: npm run test:hygiene
      - name: Static database migration safety
        run: npm run test:db-static
      - name: Logic lint
        run: npm run lint:ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: External Supabase Edge contract smoke
        env:
          EDGE_URL: https://ypgteuxzgqmkkkpvibhi.supabase.co/functions/v1/pediu-backend-api
          SUPPORT_URL: https://ypgteuxzgqmkkkpvibhi.supabase.co/functions/v1/pediu-public-support
          EDGE_PUBLISHABLE_KEY: sb_publishable_r2VeXySDe1VMkFkeubZ7ww_usGb6kSG
        run: |
          set -euo pipefail

          response="$(curl --silent --show-error --fail-with-body --retry 2 --retry-all-errors \
            --request POST "$EDGE_URL" \
            --header 'content-type: application/json' \
            --header "apikey: $EDGE_PUBLISHABLE_KEY" \
            --data '{"action":"rpc","rpc":"check_public_store_slug","args":{"_slug":"ci-edge-foundation-smoke"}}')"
          EDGE_RESPONSE="$response" node --input-type=module - <<'NODE'
          const payload = JSON.parse(process.env.EDGE_RESPONSE ?? '{}')
          if (payload.ok !== true || typeof payload.data?.available !== 'boolean') {
            console.error('Unexpected Edge gateway response:', payload)
            process.exit(1)
          }
          console.log('External Edge public contract passed')
          NODE

          unauthorized_status="$(curl --silent --show-error \
            --output /tmp/edge-unauthorized.json \
            --write-out '%{http_code}' \
            --request POST "$EDGE_URL" \
            --header 'content-type: application/json' \
            --header "apikey: $EDGE_PUBLISHABLE_KEY" \
            --data '{"action":"create_courier","input":{"fullName":"CI Smoke","phone":"34999999999","loginIdentifier":"ci.smoke","canAcceptDeliveries":true,"isActive":true,"idempotencyKey":"ci-smoke-no-auth-001"}}')"
          test "$unauthorized_status" = "401"
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs'
          const payload = JSON.parse(readFileSync('/tmp/edge-unauthorized.json', 'utf8'))
          if (payload.ok !== false || payload.error !== 'unauthorized') process.exit(1)
          console.log('External Edge authenticated action fails closed')
          NODE

          forbidden_status="$(curl --silent --show-error \
            --output /tmp/edge-forbidden.json \
            --write-out '%{http_code}' \
            --request POST "$EDGE_URL" \
            --header 'content-type: application/json' \
            --header "apikey: $EDGE_PUBLISHABLE_KEY" \
            --data '{"action":"rpc","rpc":"get_platform_health_summary","args":{}}')"
          test "$forbidden_status" = "403"
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs'
          const payload = JSON.parse(readFileSync('/tmp/edge-forbidden.json', 'utf8'))
          if (payload.ok !== false || payload.error !== 'rpc_not_allowed') process.exit(1)
          console.log('External Edge RPC allowlist fails closed')
          NODE

          support_response="$(curl --silent --show-error --fail-with-body --retry 2 --retry-all-errors \
            --request POST "$SUPPORT_URL" \
            --header 'content-type: application/json' \
            --header "apikey: $EDGE_PUBLISHABLE_KEY" \
            --data '{"action":"plans"}')"
          SUPPORT_RESPONSE="$support_response" node --input-type=module - <<'NODE'
          const payload = JSON.parse(process.env.SUPPORT_RESPONSE ?? '{}')
          if (payload.ok !== true || !Array.isArray(payload.data)) {
            console.error('Unexpected public support response:', payload)
            process.exit(1)
          }
          console.log('External public support contract passed')
          NODE

          support_forbidden_status="$(curl --silent --show-error \
            --output /tmp/support-forbidden.json \
            --write-out '%{http_code}' \
            --request POST "$SUPPORT_URL" \
            --header 'content-type: application/json' \
            --header "apikey: $EDGE_PUBLISHABLE_KEY" \
            --data '{"action":"database_dump"}')"
          test "$support_forbidden_status" = "403"
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs'
          const payload = JSON.parse(readFileSync('/tmp/support-forbidden.json', 'utf8'))
          if (payload.ok !== false || payload.error !== 'action_not_allowed') process.exit(1)
          console.log('External public support allowlist fails closed')
          NODE
      - name: Critical route smoke test
        run: npm run test:smoke

  database-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.SPARK_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        if: env.DATABASE_URL != ''
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run database security contract
        if: env.DATABASE_URL != ''
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/security_contract.sql
      - name: Run operational invariants
        if: env.DATABASE_URL != ''
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/data_invariants.sql
      - name: Explain skipped database contracts
        if: env.DATABASE_URL == ''
        run: echo "SPARK_DATABASE_URL is not configured; database contracts skipped."

  foundation-e2e:
    if: github.event_name == 'pull_request' && github.head_ref == 'e2e/foundation-20260818'
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run disposable external foundation E2E
        run: node tools/foundation-e2e.mjs
