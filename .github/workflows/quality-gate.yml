name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Repository hygiene
        run: npm run test:hygiene
      - name: Static database migration safety
        run: npm run test:db-static
      - name: Logic lint
        run: npm run lint:ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Critical route smoke test
        run: npm run test:smoke

  database-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.SPARK_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        if: env.DATABASE_URL != ''
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run database security contract
        if: env.DATABASE_URL != ''
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/security_contract.sql
      - name: Run operational invariants
        if: env.DATABASE_URL != ''
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/data_invariants.sql
      - name: Run Shark catalog engine contracts
        if: env.DATABASE_URL != ''
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/shark_engine_contract.sql
      - name: Explain skipped database contracts
        if: env.DATABASE_URL == ''
        run: echo "SPARK_DATABASE_URL is not configured; database contracts skipped."
