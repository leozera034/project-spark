name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Repository hygiene
        run: npm run test:hygiene
      - name: Static database migration safety
        run: npm run test:db-static
      - name: Merchant UX architecture guard
        run: npm run test:merchant-ux
      - name: Logic lint
        run: npm run lint:ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: External Supabase Edge contract smoke
        env:
          EDGE_URL: https://ypgteuxzgqmkkkpvibhi.supabase.co/functions/v1/pediu-backend-api
          SUPPORT_URL: https://ypgteuxzgqmkkkpvibhi.supabase.co/functions/v1/pediu-public-support
          EDGE_PUBLISHABLE_KEY: sb_publishable_r2VeXySDe1VMkFkeubZ7ww_usGb6kSG
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail-with-body --retry 2 --retry-all-errors --request POST "$EDGE_URL" --header 'content-type: application/json' --header "apikey: $EDGE_PUBLISHABLE_KEY" --data '{"action":"rpc","rpc":"check_public_store_slug","args":{"_slug":"ci-edge-foundation-smoke"}}')"
          EDGE_RESPONSE="$response" node --input-type=module - <<'NODE'
          const payload = JSON.parse(process.env.EDGE_RESPONSE ?? '{}')
          if (payload.ok !== true || typeof payload.data?.available !== 'boolean') process.exit(1)
          NODE
          unauthorized_status="$(curl --silent --show-error --output /tmp/edge-unauthorized.json --write-out '%{http_code}' --request POST "$EDGE_URL" --header 'content-type: application/json' --header "apikey: $EDGE_PUBLISHABLE_KEY" --data '{"action":"create_courier","input":{"fullName":"CI Smoke","phone":"34999999999","loginIdentifier":"ci.smoke","canAcceptDeliveries":true,"isActive":true,"idempotencyKey":"ci-smoke-no-auth-001"}}')"
          test "$unauthorized_status" = "401"
          forbidden_status="$(curl --silent --show-error --output /tmp/edge-forbidden.json --write-out '%{http_code}' --request POST "$EDGE_URL" --header 'content-type: application/json' --header "apikey: $EDGE_PUBLISHABLE_KEY" --data '{"action":"rpc","rpc":"get_platform_health_summary","args":{}}')"
          test "$forbidden_status" = "403"
          support_response="$(curl --silent --show-error --fail-with-body --retry 2 --retry-all-errors --request POST "$SUPPORT_URL" --header 'content-type: application/json' --header "apikey: $EDGE_PUBLISHABLE_KEY" --data '{"action":"plans"}')"
          SUPPORT_RESPONSE="$support_response" node --input-type=module - <<'NODE'
          const payload = JSON.parse(process.env.SUPPORT_RESPONSE ?? '{}')
          if (payload.ok !== true || !Array.isArray(payload.data)) process.exit(1)
          NODE
          support_forbidden_status="$(curl --silent --show-error --output /tmp/support-forbidden.json --write-out '%{http_code}' --request POST "$SUPPORT_URL" --header 'content-type: application/json' --header "apikey: $EDGE_PUBLISHABLE_KEY" --data '{"action":"database_dump"}')"
          test "$support_forbidden_status" = "403"
      - name: Critical route smoke test
        run: npm run test:smoke

  database-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.SPARK_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        if: env.DATABASE_URL != ''
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run database security contract
        if: env.DATABASE_URL != ''
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/security_contract.sql
      - name: Run multi-store contract
        if: env.DATABASE_URL != ''
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/multistore_contract.sql
      - name: Run add-on billing contract
        if: env.DATABASE_URL != ''
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/addon_billing_contract.sql
      - name: Run WhatsApp provisioning contract
        if: env.DATABASE_URL != ''
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/whatsapp_provisioning_contract.sql
      - name: Run operational invariants
        if: env.DATABASE_URL != ''
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/data_invariants.sql
      - name: Explain skipped database contracts
        if: env.DATABASE_URL == ''
        run: echo "SPARK_DATABASE_URL is not configured; database contracts skipped."
