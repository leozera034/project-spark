name: Order state machine DB tests

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/db-order-state-machine.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/db-order-state-machine.yml"

permissions:
  contents: read

concurrency:
  group: state-db-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  order-state-machine:
    name: Order and delivery state invariants
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.101.0
          github-token: ${{ github.token }}

      - name: Build isolated state-machine workdir
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci/state-db
          mkdir -p .ci/state-db/supabase/migrations
          mkdir -p .ci/state-db/supabase/tests/database

          cp supabase/config.toml .ci/state-db/supabase/config.toml

          find supabase/migrations -maxdepth 1 -type f -name '20260731*.sql' -print0 \
            | sort -z \
            | xargs -0 -I{} cp "{}" .ci/state-db/supabase/migrations/

          # Fase 18 efetiva: estrutura de delivery, gestão e transição de pedido
          # separando retirada de entrega.
          cp supabase/migrations/20260802183724_6762713c-1cd7-425d-99d0-b4f53fa8228e.sql .ci/state-db/supabase/migrations/
          cp supabase/migrations/20260802183933_d16e989c-5140-491b-bd2a-447b71254d8f.sql .ci/state-db/supabase/migrations/
          cp supabase/migrations/20260802184111_8b66408a-944c-49da-9b37-1d91652904c0.sql .ci/state-db/supabase/migrations/

          cp supabase/tests/database/order_state_machine.test.sql .ci/state-db/supabase/tests/database/

          echo "State-machine migration count: $(find .ci/state-db/supabase/migrations -type f -name '*.sql' | wc -l)"

      - name: Start isolated state-machine database
        run: |
          supabase --workdir .ci/state-db start \
            -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Run plain SQL transition probe
        shell: bash
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep -E '^supabase_db_' | head -1)"
          test -n "$DB_CONTAINER"
          echo "Using database container: $DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" \
            psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < supabase/tests/database/order_state_machine_probe.sql

      - name: Run order state-machine pgTAP suite
        run: |
          supabase --workdir .ci/state-db test db \
            supabase/tests/database/order_state_machine.test.sql

      - name: Capture PostgreSQL crash diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          echo "=== Docker containers ==="
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
          echo
          for container in $(docker ps -a --format '{{.Names}}' | grep -E '^supabase_db_' || true); do
            echo "=== PostgreSQL logs: ${container} ==="
            docker logs --tail 500 "${container}" 2>&1 || true
          done
          echo
          echo "=== Kernel/OOM hints ==="
          dmesg 2>/dev/null | tail -100 || true

      - name: Stop isolated Supabase database
        if: ${{ always() }}
        run: supabase --workdir .ci/state-db stop --no-backup
