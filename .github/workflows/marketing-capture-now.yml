name: Marketing Capture Now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/marketing-capture-now.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: https://shark-cardapio.lovable.app
      DATABASE_URL: ${{ secrets.SPARK_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require database credential
        run: test -n "$DATABASE_URL"
      - name: Install browser and database client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Load QA capture account securely
        shell: bash
        run: |
          set -euo pipefail
          STORE_JSON="$(psql "$DATABASE_URL" -Atc "select decrypted_secret from vault.decrypted_secrets where name='qa_marketing_capture_store_owner' limit 1")"
          test -n "$STORE_JSON"
          STORE_EMAIL="$(node -e 'const j=JSON.parse(process.argv[1]); process.stdout.write(j.email)' "$STORE_JSON")"
          STORE_PASSWORD="$(node -e 'const j=JSON.parse(process.argv[1]); process.stdout.write(j.password)' "$STORE_JSON")"
          STORE_SLUG="$(node -e 'const j=JSON.parse(process.argv[1]); process.stdout.write(j.slug)' "$STORE_JSON")"
          echo "::add-mask::$STORE_EMAIL"
          echo "::add-mask::$STORE_PASSWORD"
          echo "STORE_EMAIL=$STORE_EMAIL" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "STORE_SLUG=$STORE_SLUG" >> "$GITHUB_ENV"
      - name: Capture real public and merchant screens
        run: |
          mkdir -p marketing/captures/generated
          cat > /tmp/capture-now.mjs <<'NODE'
          import { chromium } from 'playwright'
          import fs from 'node:fs'

          const APP = process.env.APP_URL
          const email = process.env.STORE_EMAIL
          const password = process.env.STORE_PASSWORD
          const slug = process.env.STORE_SLUG
          const out = 'marketing/captures/generated'

          const browser = await chromium.launch({ headless: true })
          const settle = async (page) => {
            await page.waitForLoadState('domcontentloaded')
            await page.waitForTimeout(2500)
          }
          const shot = async (page, name) => {
            await settle(page)
            await page.screenshot({ path: `${out}/${name}.png`, fullPage: true })
          }

          const mobile = await browser.newContext({ viewport: { width: 390, height: 844 } })
          const mp = await mobile.newPage()
          await mp.goto(`${APP}/loja/${slug}`, { timeout: 60000, waitUntil: 'domcontentloaded' })
          await shot(mp, 'cliente_01_cardapio_mobile')
          await mobile.close()

          const desktop = await browser.newContext({ viewport: { width: 1440, height: 1000 } })
          const page = await desktop.newPage()
          await page.goto(`${APP}/loja/${slug}`, { timeout: 60000, waitUntil: 'domcontentloaded' })
          await shot(page, 'cliente_02_cardapio_desktop')

          await page.goto(`${APP}/entrar/loja`, { timeout: 60000, waitUntil: 'domcontentloaded' })
          await page.fill('#email', email)
          await page.locator('input[type="password"]').fill(password)
          await page.locator('button[type="submit"]').click()
          await page.waitForTimeout(3500)
          await shot(page, 'lojista_01_dashboard_desktop')

          const routes = [
            ['/app/loja/cardapio', 'lojista_02_cardapio_desktop'],
            ['/app/loja/entregas', 'lojista_03_entregas_desktop'],
            ['/app/loja/financeiro', 'lojista_04_financeiro_desktop'],
            ['/app/loja/crescimento', 'lojista_05_crescimento_desktop'],
            ['/app/loja/cozinha', 'lojista_06_cozinha_desktop'],
            ['/app/loja/configuracoes', 'lojista_07_configuracoes_desktop'],
            ['/app/loja/avaliacoes', 'lojista_08_avaliacoes_desktop'],
            ['/app/loja/ajuda', 'lojista_09_ajuda_desktop'],
          ]

          for (const [route, name] of routes) {
            try {
              await page.goto(`${APP}${route}`, { timeout: 60000, waitUntil: 'domcontentloaded' })
              await shot(page, name)
            } catch (error) {
              console.warn(`capture failed ${route}: ${error.message}`)
            }
          }

          await desktop.close()
          await browser.close()
          fs.writeFileSync(`${out}/capture-info.json`, JSON.stringify({ slug, capturedAt: new Date().toISOString() }, null, 2))
          console.log(`generated=${fs.readdirSync(out).filter((f) => f.endsWith('.png')).length}`)
          NODE
          node /tmp/capture-now.mjs
      - name: Commit generated screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/captures/generated
          git diff --cached --quiet && exit 0
          git commit -m "chore: add marketing screenshots"
          git push
      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comandiva-marketing-captures
          path: marketing/captures/generated
          if-no-files-found: warn
          retention-days: 14
