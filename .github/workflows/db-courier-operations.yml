name: Courier operations DB tests

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/db-courier-operations.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/db-courier-operations.yml"

permissions:
  contents: read

concurrency:
  group: courier-db-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  courier-operations:
    name: Courier operational invariants
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.113.0
          github-token: ${{ github.token }}

      - name: Build isolated courier workdir
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci/courier-db
          mkdir -p .ci/courier-db/supabase/migrations .ci/courier-db/supabase/tests/database
          cp supabase/config.toml .ci/courier-db/supabase/config.toml

          find supabase/migrations -maxdepth 1 -type f -name '20260731*.sql' -print0 \
            | sort -z \
            | xargs -0 -I{} cp "{}" .ci/courier-db/supabase/migrations/

          cp supabase/migrations/20260802183724_6762713c-1cd7-425d-99d0-b4f53fa8228e.sql .ci/courier-db/supabase/migrations/
          cp supabase/migrations/20260802183933_d16e989c-5140-491b-bd2a-447b71254d8f.sql .ci/courier-db/supabase/migrations/
          cp supabase/migrations/20260802184111_8b66408a-944c-49da-9b37-1d91652904c0.sql .ci/courier-db/supabase/migrations/
          cp supabase/migrations/20260803115434_f7fcbebc-f5c0-4daf-893d-61ad31bf81ab.sql .ci/courier-db/supabase/migrations/

          cp supabase/tests/database/courier_operations.test.sql .ci/courier-db/supabase/tests/database/
          echo "Courier migration count: $(find .ci/courier-db/supabase/migrations -type f -name '*.sql' | wc -l)"

      - name: Start isolated courier database
        run: |
          supabase --workdir .ci/courier-db start \
            -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Run courier operations pgTAP suite
        run: supabase --workdir .ci/courier-db test db supabase/tests/database/courier_operations.test.sql

      - name: Capture PostgreSQL diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
          for container in $(docker ps -a --format '{{.Names}}' | grep -E '^supabase_db_' || true); do
            echo "=== PostgreSQL logs: ${container} ==="
            docker logs --tail 500 "${container}" 2>&1 || true
          done

      - name: Stop isolated Supabase database
        if: ${{ always() }}
        run: supabase --workdir .ci/courier-db stop --no-backup
