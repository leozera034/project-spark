name: Checkout DB tests

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/db-checkout.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/db-checkout.yml"

permissions:
  contents: read

concurrency:
  group: checkout-db-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkout-database:
    name: Migrations and pgTAP checkout
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.101.0
          github-token: ${{ github.token }}

      - name: Start local Supabase
        run: supabase start

      - name: Run checkout pgTAP suite
        run: supabase test db supabase/tests/database/checkout_atomicity.test.sql

      - name: Stop local Supabase
        if: ${{ always() }}
        run: supabase stop --no-backup
