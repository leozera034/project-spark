name: Marketing Capture

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/marketing-capture.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: https://shark-cardapio.lovable.app
      SUPABASE_URL: https://ypgteuxzgqmkkkpvibhi.supabase.co
      EDGE_URL: https://ypgteuxzgqmkkkpvibhi.supabase.co/functions/v1/pediu-backend-api
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_r2VeXySDe1VMkFkeubZ7ww_usGb6kSG
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture real COMANDIVA screens
        run: |
          mkdir -p marketing/captures/generated
          cat > /tmp/capture.mjs <<'NODE'
          import { chromium } from 'playwright';
          import { createHash, randomBytes } from 'node:crypto';
          import fs from 'node:fs';

          const APP = process.env.APP_URL;
          const SUPA = process.env.SUPABASE_URL;
          const EDGE = process.env.EDGE_URL;
          const KEY = process.env.SUPABASE_PUBLISHABLE_KEY;
          const out = 'marketing/captures/generated';
          const stamp = Date.now();
          const slug = `comandiva-captura-${stamp.toString(36)}`;
          const email = `qa.capture.${stamp}@example.com`;
          const password = `Qa!${randomBytes(12).toString('hex')}7a`;
          const courierId = `comandiva.capture.${String(stamp).slice(-8)}`;
          const courierPassword = `Courier!${randomBytes(10).toString('hex')}7a`;

          async function jsonFetch(url, options = {}) {
            const res = await fetch(url, options);
            const text = await res.text();
            let body = {};
            try { body = text ? JSON.parse(text) : {}; } catch { body = { raw: text }; }
            if (!res.ok) throw new Error(`${res.status} ${url}: ${text.slice(0,500)}`);
            return body;
          }

          const edgeHeaders = { 'content-type': 'application/json', apikey: KEY };
          const created = await jsonFetch(EDGE, {
            method: 'POST', headers: edgeHeaders,
            body: JSON.stringify({
              action: 'create_store_account',
              input: {
                storeName: 'COMANDIVA Demo Burger', slug, segment: 'Hamburgueria',
                city: 'São Paulo', state: 'SP', phone: '11999990000',
                ownerName: 'Equipe COMANDIVA Demo', email, password, planCode: 'avancado'
              }
            })
          });
          if (!created?.ok) throw new Error(`store creation failed: ${JSON.stringify(created)}`);
          const storeId = created.data.storeId;

          const auth = await jsonFetch(`${SUPA}/auth/v1/token?grant_type=password`, {
            method: 'POST',
            headers: { 'content-type': 'application/json', apikey: KEY },
            body: JSON.stringify({ email, password })
          });
          const token = auth.access_token;
          const restHeaders = {
            'content-type': 'application/json', apikey: KEY,
            authorization: `Bearer ${token}`, prefer: 'return=representation'
          };

          try {
            await jsonFetch(`${SUPA}/rest/v1/store_settings?store_id=eq.${storeId}`, {
              method: 'PATCH', headers: restHeaders,
              body: JSON.stringify({
                description: 'Hambúrgueres artesanais, combos e bebidas com pedido online.',
                welcome_message: 'Peça fácil. Acompanhe em tempo real.',
                brand_primary: '#55207A', brand_accent: '#FF681F',
                manual_override_open: true, min_order_amount: 15, default_prep_minutes: 25
              })
            });

            const cats = await jsonFetch(`${SUPA}/rest/v1/categories`, {
              method: 'POST', headers: restHeaders,
              body: JSON.stringify([
                { store_id: storeId, name: 'Mais pedidos', description: 'Os favoritos da casa', sort_order: 1 },
                { store_id: storeId, name: 'Combos', description: 'Combinações completas', sort_order: 2 },
                { store_id: storeId, name: 'Bebidas', description: 'Geladas para acompanhar', sort_order: 3 }
              ])
            });
            const byName = Object.fromEntries(cats.map(c => [c.name, c.id]));
            await jsonFetch(`${SUPA}/rest/v1/products`, {
              method: 'POST', headers: restHeaders,
              body: JSON.stringify([
                { store_id: storeId, category_id: byName['Mais pedidos'], name: 'COMANDIVA Burger', description: 'Pão brioche, carne 160g, cheddar e molho especial.', base_price: 29.9, is_featured: true, sort_order: 1 },
                { store_id: storeId, category_id: byName['Mais pedidos'], name: 'Duplo Bacon', description: 'Duas carnes, bacon crocante, queijo e cebola caramelizada.', base_price: 36.9, is_featured: true, sort_order: 2 },
                { store_id: storeId, category_id: byName['Combos'], name: 'Combo Burger + Fritas', description: 'Burger artesanal, fritas crocantes e bebida.', base_price: 42.9, is_featured: true, sort_order: 1 },
                { store_id: storeId, category_id: byName['Combos'], name: 'Combo Duplo', description: 'Duplo bacon, fritas e bebida.', base_price: 49.9, sort_order: 2 },
                { store_id: storeId, category_id: byName['Bebidas'], name: 'Refrigerante lata', description: '350 ml gelado.', base_price: 7.0, sort_order: 1 },
                { store_id: storeId, category_id: byName['Bebidas'], name: 'Suco natural', description: '500 ml.', base_price: 10.0, sort_order: 2 }
              ])
            });
          } catch (e) {
            console.warn('Seed parcial:', e.message);
          }

          const courier = await jsonFetch(EDGE, {
            method: 'POST',
            headers: { ...edgeHeaders, authorization: `Bearer ${token}` },
            body: JSON.stringify({
              action: 'create_courier',
              input: {
                fullName: 'Entregador COMANDIVA Demo', phone: '11988880000',
                loginIdentifier: courierId, vehicle: 'moto',
                canAcceptDeliveries: true, isActive: true,
                idempotencyKey: `marketing-capture-${stamp}`
              }
            })
          });
          const tempPassword = courier?.data?.temporaryPassword;
          if (!tempPassword) throw new Error(`courier creation failed: ${JSON.stringify(courier)}`);

          const syntheticEmail = `${createHash('sha256').update(`pediu-aqui:courier:${courierId}`).digest('hex').slice(0,32)}@courier.pediuaqui.internal`;
          const courierAuth = await jsonFetch(`${SUPA}/auth/v1/token?grant_type=password`, {
            method: 'POST', headers: { 'content-type': 'application/json', apikey: KEY },
            body: JSON.stringify({ email: syntheticEmail, password: tempPassword })
          });
          await jsonFetch(`${SUPA}/auth/v1/user`, {
            method: 'PUT',
            headers: { 'content-type': 'application/json', apikey: KEY, authorization: `Bearer ${courierAuth.access_token}` },
            body: JSON.stringify({ password: courierPassword })
          });
          await jsonFetch(`${SUPA}/rest/v1/rpc/complete_my_initial_password_change`, {
            method: 'POST',
            headers: { 'content-type': 'application/json', apikey: KEY, authorization: `Bearer ${courierAuth.access_token}` },
            body: '{}'
          });

          const browser = await chromium.launch({ headless: true });
          const pause = async page => { await page.waitForLoadState('domcontentloaded'); await page.waitForTimeout(2200); };
          const shot = async (page, name, fullPage = true) => {
            await pause(page);
            await page.screenshot({ path: `${out}/${name}.png`, fullPage });
          };

          const mobile = await browser.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
          const mp = await mobile.newPage();
          await mp.goto(`${APP}/loja/${slug}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
          await shot(mp, 'cliente_01_cardapio_mobile');
          await mobile.close();

          const desktop = await browser.newContext({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
          const dp = await desktop.newPage();
          await dp.goto(`${APP}/loja/${slug}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
          await shot(dp, 'cliente_02_cardapio_desktop');

          await dp.goto(`${APP}/entrar/loja`, { waitUntil: 'domcontentloaded', timeout: 60000 });
          await dp.fill('#email', email);
          await dp.locator('input[type="password"]').fill(password);
          await dp.locator('button[type="submit"]').click();
          await dp.waitForTimeout(3500);
          await shot(dp, 'lojista_01_dashboard_desktop');

          const links = await dp.locator('a[href^="/app/loja"]').evaluateAll(els => [...new Set(els.map(a => a.getAttribute('href')).filter(Boolean))]);
          const preferred = ['/app/loja/cardapio','/app/loja/entregas','/app/loja/financeiro','/app/loja/crescimento','/app/loja/cozinha','/app/loja/configuracoes','/app/loja/avaliacoes','/app/loja/ajuda'];
          const routes = [...new Set([...preferred, ...links])].slice(0, 12);
          let i = 2;
          for (const route of routes) {
            try {
              await dp.goto(`${APP}${route}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
              const label = route.replace('/app/loja','').replaceAll('/','_').replace(/^_+/,'') || 'home';
              await shot(dp, `lojista_${String(i).padStart(2,'0')}_${label}_desktop`);
              i++;
            } catch (e) { console.warn('route capture failed', route, e.message); }
          }
          await desktop.close();

          const courierCtx = await browser.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
          const cp = await courierCtx.newPage();
          await cp.goto(`${APP}/entrar/entregador`, { waitUntil: 'domcontentloaded', timeout: 60000 });
          await cp.fill('#identificador', courierId);
          await cp.locator('input[type="password"]').fill(courierPassword);
          await cp.locator('button[type="submit"]').click();
          await cp.waitForTimeout(3500);
          await shot(cp, 'entregador_01_dashboard_mobile');
          const cLinks = await cp.locator('a[href^="/app/entregador"]').evaluateAll(els => [...new Set(els.map(a => a.getAttribute('href')).filter(Boolean))]);
          let ci = 2;
          for (const route of cLinks.slice(0, 8)) {
            try {
              await cp.goto(`${APP}${route}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
              const label = route.replace('/app/entregador','').replaceAll('/','_').replace(/^_+/,'') || 'home';
              await shot(cp, `entregador_${String(ci).padStart(2,'0')}_${label}_mobile`);
              ci++;
            } catch (e) { console.warn('courier capture failed', route, e.message); }
          }
          await courierCtx.close();
          await browser.close();

          fs.writeFileSync(`${out}/capture-info.json`, JSON.stringify({ slug, storeId, capturedAt: new Date().toISOString() }, null, 2));
          console.log(`Captured ${fs.readdirSync(out).filter(f => f.endsWith('.png')).length} PNGs`);
          NODE
          node /tmp/capture.mjs
      - name: Upload screenshot pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comandiva-marketing-captures
          path: marketing/captures/generated
          if-no-files-found: warn
          retention-days: 14
      - name: Commit captures to repository
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/captures/generated
          git diff --cached --quiet && exit 0
          git commit -m "chore: add generated marketing captures"
          git push
